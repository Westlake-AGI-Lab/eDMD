# Main table, FLUX.2-klein 4B, TDM (our l2 re-implementation).
description: >-
  TDM (l2 re-implementation, configs/methods/tdm_l2.yaml) on FLUX.2-klein base 4B at the teacher's default guidance
  w = 4; EMA kept for evaluation; 2000 updates.
model: flux2_klein_4b
method: tdm_l2
eval: drawbench1k
run:
  name: flux2_klein_4b_tdm
  output_root: outputs
  seed: 20260720
  data: {path: datasets/train/mixed_200k_train.txt, global_batch_size: 16}
  wandb: {enabled: true, mode: online}
  checkpoint_every: 100
  eval_every: 100
  eval_ema: true
overrides:
  method.updates.ema: {enabled: true, decay: 0.999, update_every: 1, warmup: true, offset: 1}
