# Main table, FLUX.2-klein 9B, TDM (our l2 re-implementation).
description: >-
  TDM (l2 re-implementation, configs/methods/tdm_l2.yaml) on FLUX.2-klein base 9B at the teacher's default guidance
  w = 4 with both learning rates halved from 4B (student 2e-6, fake 1e-5); EMA kept for evaluation; 2000 updates.
model: flux2_klein_9b
method: tdm_l2
eval: drawbench1k
run:
  name: flux2_klein_9b_tdm
  output_root: outputs
  seed: 20260720
  data: {path: datasets/train/mixed_200k_train.txt, global_batch_size: 16}
  wandb: {enabled: true, mode: online}
  checkpoint_every: 100
  eval_every: 100
  eval_ema: true
overrides:
  method.updates.student.lr: 2.0e-6
  method.updates.fake.lr: 1.0e-5
  method.updates.ema: {enabled: true, decay: 0.999, update_every: 1, warmup: true, offset: 1}
