# Main table, FLUX.2-klein 9B, eDMD.
description: >-
  eDMD on FLUX.2-klein base 9B at the teacher's default guidance w = 4: endpoint critic trained in full (all
  parameters, LR 1.5e-6), calibrated reads before the last step (FLUX.2-klein 9B table), precise teacher over the
  last step's band; student LR 3e-6 (half the 4B value), constant after 100 warm-up updates, then a half cosine to 0
  from update 1200; 2000 updates.
model: flux2_klein_9b
method: edmd
eval: drawbench1k
run:
  name: flux2_klein_9b_edmd
  output_root: outputs
  seed: 20260720
  data: {path: datasets/train/mixed_200k_train.txt, global_batch_size: 16}
  wandb: {enabled: true, mode: online}
  checkpoint_every: 100
  eval_every: 100
  eval_ema: true
overrides:
  model.roles.fake.train: full
  model.roles.fake.lora: null
  method.updates.fake.lr: 1.5e-6
  method.updates.student.lr: 3.0e-6
  method.updates.student.schedule: {kind: constant_then_cosine, warmup: 100, decay_start: 1200}
  method.generator.terms:
    - kind: coupled
      query:
        source: next_state
        range: interval
        interval: overlap
        space: sigma
        lo: 0.02
        margin: 0.01
        waypoint: calibrated
        waypoint_noise: fresh
        calibration: flux2_klein_9b   # configs/calibration/flux2_klein_9b.json
