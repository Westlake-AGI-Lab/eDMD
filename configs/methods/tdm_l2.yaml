# TDM, our l2 re-implementation (the FLUX.2 rows of the paper): TDM's trajectory reads and x0-label critic with
# sigma-space queries, an MSE surrogate in place of the released Huber loss, and 5 fake updates per student update.
# On FLUX.2-klein 4B it outscores the released Huber command (configs/methods/tdm.yaml).
name: tdm_l2
num_steps: 4
schedule: native
rollout: {sampler: euler, grid: fixed, to_exit: false}
step_select: per_sample
critic:
  source: phase_state
  query: {source: next_state, range: interval, interval: separate, space: sigma, lo: 0.02, margin: 0.01}
  label: x0
  weight: {kind: min_snr, cap: 5.0, importance: true}
generator:
  terms:
    - kind: coupled
      query: {source: next_state, range: interval, interval: separate, space: sigma, lo: 0.02, margin: 0.01}
  normalization: {reference: guided, dtype: float32}
  loss: {form: mse, placement: target}
engine:
  cfg: 4.0
  precise_teacher: {enabled: false}
updates:
  ratio: 5
  order: critic_first
  max_steps: 2000
  student: {lr: 4.0e-6, betas: [0.0, 0.95], weight_decay: 0.01, eps: 1.0e-8, clip: 1.0,
            schedule: {kind: cosine, warmup: 100}}
  fake: {lr: 2.0e-5, betas: [0.0, 0.95], weight_decay: 0.01, eps: 1.0e-8, clip: null, schedule: {kind: constant}}
  ema: {enabled: false}
