# DMD2 (Yin et al., 2024) without the GAN term, following the official code (github.com/tianweiy/DMD2) and its SDXL
# 4-step LoRA setting.
# Flow-matching translation: backward simulation predicts x0 and re-noises it with fresh noise at every step; a
# uniform integer timestep becomes a uniform raw time warped by the model's shift.
name: dmd2
num_steps: 4
schedule: native
rollout: {sampler: x0_renoise, grid: fixed, to_exit: true}   # backward simulation to a random exit step
step_select: shared                                          # one exit step for all ranks
critic:
  source: exit_x0                                            # the generator's x0 of this iteration, detached
  query: {source: x0, range: uniform, space: raw, lo: 0.0, hi: 0.999}   # t ~ U{0..999}
  label: fresh
  weight: {kind: eps_space}                                  # eps-prediction MSE
generator:
  terms:
    - kind: coupled                                          # grad = (p_real - p_fake) / mean|p_real|
      query: {source: x0, range: uniform, space: raw, lo: 0.02, hi: 0.98}   # t ~ U{20..980}
  normalization: {reference: guided, dtype: float64, nan_to_num: true}
  loss: {form: mse, placement: target, scale: 0.5}           # 0.5 * mse(x, sg(x - grad))
engine:
  cfg: 8.0                                                   # the teacher's guidance scale; the fake has no CFG
  precise_teacher: {enabled: false}
updates:
  ratio: 5                                                   # fake updates per student update
  order: generator_first                                     # generator turn, then guidance (fake) turn
  max_steps: 2000
  # The warmup of 500 scheduler ticks is counted once per process: with the 64 processes of the SDXL setting the fake
  # reaches full LR after 500 / 64 = 7.8 updates, the generator after 500 / (64 x 5) = 1.6.
  student: {lr: 5.0e-5, betas: [0.9, 0.999], weight_decay: 0.01, eps: 1.0e-8, clip: 10.0,
            schedule: {kind: constant_with_warmup, warmup: 2}}
  fake: {lr: 5.0e-5, betas: [0.9, 0.999], weight_decay: 0.01, eps: 1.0e-8, clip: 10.0,
         schedule: {kind: constant_with_warmup, warmup: 8}}
  ema: {enabled: false}
